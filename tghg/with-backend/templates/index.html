<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключение CSS через url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Main</title>
</head>
<body>
    <div>
        <h1 style="text-align: center; font-size: 50px; margin-top: 20px;">Welcome to my website</h1>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <h1 id="title">Created by: Narek</h1>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;"> 
        <h2>you can also visit my <a href="https://github.com/inbusiness610-hash" target="_blank">Github account</a></h2>
    </div>
    <br>
    
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <h1>Here are some of my projects created on Informatics lessons</h1>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%; margin: 20px;">
        <!-- Ссылки на роуты Flask -->
        <button class="glass-button" onclick="window.location.href='{{ url_for('first_page') }}'">Go for very first page</button>
        <button class="glass-button" onclick="window.location.href='{{ url_for('hr_page') }}'">Go for HR</button>
    </div>
    <br>
    <hr style="border: 1px solid rgba(0, 243, 255, 0.3); margin: 20px;">
    <br>
    <h1 style="text-align: center; font-size: 50px; margin-top: 20px;">And here are some projects created for fun</h1>
    <br>
    <br>
    <h1 style="text-align: center; font-size: 50px; margin-top: 20px;">Slot Machine</h1>
    <div class="slot-container">
        <div class="slot-machine">
            <div class="slot-header">
                <div class="stat-box">
                    <span>BALANCE</span>
                    <!-- Начальное значение вставляется сразу из Flask через Jinja2 -->
                    <p id="balance">${{ balance }}</p>
                </div>
                <div class="stat-box">
                    <span>BET</span>
                    <p id="bet">$10</p>
                </div>
            </div>

            <div class="reels">
                <div class="payline-guide"></div>
                <div class="reel"><div class="strip"></div></div>
                <div class="reel"><div class="strip"></div></div>
                <div class="reel"><div class="strip"></div></div>
            </div>

            <div class="controls">
                <button id="sbet" class="bet-btn">-</button>
                <button id="spin-btn">SPIN</button>
                <button id="ibet" class="bet-btn">+</button>
            </div>

            <div id="result">Press SPIN to play!</div>
        </div>
    </div>

    <!-- Подключение JS через url_for -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>First</title>
</head>
<body>
    <div>
        <h1 style="text-align: center; font-size: 50px; margin-top: 20px;">Welcome to my first page</h1>
        <h2 style="text-align: center; font-size: 30px; margin-top: 20px;">Here is represented my work with tag b, i, u, sup and sub</h2>
    </div>
    
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <b style="font-size: 50px;">This is a bold text</b>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <i style="font-size: 50px;">This is an italic text</i>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <sub style="font-size: 50px;">This is a subscript text</sub>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <sup style="font-size: 50px;">This is a superscript text</sup>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <u style="font-size: 50px;">This is an underlined text</u>
    </div>
    <br>
    <br>
    <br>
    <div style="display: flex; justify-content: center; align-items: center; height: 30%;">
        <button class="glass-button" onclick="window.location.href='index.html'">Go back to main page</button>
    </div>

</html>
